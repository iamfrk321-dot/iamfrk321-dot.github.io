<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farhan Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        .calculator {
            width: 320px;
            padding: 20px;

            background: #111c2d;
            border: 1px solid #334155;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 20px;
        }

        #display {
            width: 100%;
            height: 70px;

            margin-bottom: 15px;
            padding: 15px;

            background: #07111f;
            color: white;

            border: 1px solid #334155;
            border-radius: 10px;

            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;

            border: none;
            border-radius: 10px;

            background: #1e293b;
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #334155;
        }

        .operator {
            background: #0ea5e9;
            color: #07111f;
            font-weight: bold;
        }

        .equal {
            background: #22c55e;
            color: #07111f;
            font-weight: bold;
        }

        .clear {
            background: #ef4444;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Farhan Calculator</h1>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="addValue('%')">%</button>
            <button class="operator" onclick="addValue('/')">÷</button>

            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>
            <button class="operator" onclick="addValue('*')">×</button>

            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button class="operator" onclick="addValue('-')">−</button>

            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>
            <button class="operator" onclick="addValue('+')">+</button>

            <button onclick="addValue('0')">0</button>
            <button onclick="addValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>

        let display = document.getElementById("display");

        function addValue(value) {

            if (display.value === "0") {
                display.value = value;
            } else {
                display.value += value;
            }

        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {

            display.value = display.value.slice(0, -1);

            if (display.value === "") {
                display.value = "0";
            }

        }

        function calculate() {

            try {
                display.value = eval(display.value);
            }

            catch {
                display.value = "Error";
            }

        }

    </script>

</body>
</html>
